
[build-system]
requires = ["Cython", "setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ateams"
version = "2.2.0"
description = "Algebraic Topology-Enabled AlgorithMs for Spin systems"
readme = "README.md"

requires-python = ">=3.9"
dependencies = [
    "Cython",
    "numpy",
    "tqdm",
    "packaging",
    "lz4"
]

# Only `ateams.models.BernoulliSite` needs GUDHI, so
# `import ateams` works fine without it. Kept as an extra so it isn't forced on
# everything else.
[project.optional-dependencies]
site-percolation = ["gudhi"]

[tool.setuptools]
py-modules = ["ateams"]
